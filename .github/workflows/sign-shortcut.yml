name: ✍️ Firmar Jarvis.shortcut con macOS

on:
  push:
    paths:
      - 'Jarvis.shortcut'
  workflow_dispatch:

jobs:
  sign:
    runs-on: macos-latest

    steps:
      - name: 📥 Descargar código
        uses: actions/checkout@v4

      - name: 🔍 Diagnóstico del entorno
        run: |
          echo "macOS version:"
          sw_vers
          echo "Xcode version:"
          xcode-select --version
          echo "shortcuts path:"
          which shortcuts || echo "shortcuts no encontrado en PATH"
          ls /usr/bin/shortcuts || echo "No está en /usr/bin"
          xcrun --find shortcuts 2>/dev/null || echo "xcrun tampoco lo encuentra"

      - name: ✍️ Firmar con xcrun shortcuts
        run: |
          echo "Archivo a firmar:"
          ls -lh Jarvis.shortcut
          xcrun shortcuts sign -m anyone -i Jarvis.shortcut -o Jarvis_FIRMADO.shortcut
          echo "✅ Firmado:"
          ls -lh Jarvis_FIRMADO.shortcut

      - name: 📤 Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Firmado-para-iPhone
          path: Jarvis_FIRMADO.shortcut
          retention-days: 30
